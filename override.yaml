# ============================================================
# Mihomo YAML 覆写（规则层）— 自维护仓库 clash-rules
# 版本：2026-11-19
#
# 用途：给支持 YAML 覆写 / Merge 的客户端用（如 Clash Verge Rev 的 Merge）。
# 本文件只包含「规则层」：全部 rule-providers + 需要抢在最前面命中的规则
# （prepend-rules）。代理分组、DNS、hosts 的完整逻辑在 override.js 里，
# 以 JS 版为准；两处规则如有分歧，先改 JS 再同步这里。
#
# 注意：prepend-rules 里的规则只引用 REJECT 和本文件定义的 rule-providers，
# 不依赖 JS 生成的分组，单独使用也不会报错。
# ============================================================

