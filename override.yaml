prepend-rules:
  # 红果短剧（com.phoenix.read）穿山甲广告专项拦截，仅对该 App 生效
  # 拦截后「看广告得金币 / 解锁集数」会加载失败；不要整域拦 snssdk / zijieapi / fqnovel，正片会一起死
  - 'AND,((PROCESS-NAME,com.phoenix.read),(OR,((DOMAIN-KEYWORD,pangolin),(DOMAIN-SUFFIX,pglstatp-toutiao.com),(DOMAIN-SUFFIX,pglstatp-toutiao-b.com),(DOMAIN-KEYWORD,-ad-sign.byteimg.com),(DOMAIN,zlink.ugsdk.cn)))),REJECT'
  # 广告大表前置（在订阅自带规则之前命中；误伤时在客户端把对应域名加白名单直连）
  - 'RULE-SET,anti_ad,REJECT'
  - 'RULE-SET,category-ads,REJECT'
